name: Deploy to S3 + CloudFront

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::922184636590:role/github-actions-sipvoipai-deploy
          aws-region: ca-central-1

      - name: Sync to S3
        run: |
          aws s3 sync . s3://sipvoipai-website \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude "index (1).html" \
            --delete \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1HMM5UDAKBIG7 \
            --paths "/*"
